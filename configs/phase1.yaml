# =============================================================================
# Open Player - Phase 1 configuration (Learning Validation)
#
# Phase 1 extends Phase 0 WITHOUT changing its semantics: every Phase 0 key
# keeps its meaning; new sections (vision / multi_step / rollout_schedule /
# event_pred / intrinsic / skill_training / transfer / evaluation) control
# the Phase 1 additions.  Phase 0 configs/phase0.yaml continues to run.
# =============================================================================

meta:
  name: open-player-phase1
  version: 1
  description: >-
    Phase 1 Learning Validation: learned vision, multi-step world model,
    learned change prediction, neural skill, intrinsic exploration and
    transfer evaluation.

seed: 1
device: auto
logging:
  level: INFO

# -----------------------------------------------------------------------------
# Core schema (identical to Phase 0)
# -----------------------------------------------------------------------------
schema:
  max_entities: 32
  world_size: 12
  max_speed: 1.0
  max_size: 3.0
  entity_fields:
    - { name: position,            dim: 2 }
    - { name: velocity,            dim: 2 }
    - { name: size,                dim: 1 }
    - { name: appearance,          dim: 8 }
    - { name: semantic_features,   dim: 16 }
    - { name: dynamics_features,   dim: 12 }
    - { name: status,              dim: 1 }
  belief_dim: 8
  relation_fields:
    - { name: distance,            dim: 1 }
    - { name: direction,           dim: 2 }
    - { name: relative_velocity,   dim: 2 }
    - { name: overlap,             dim: 1 }
    - { name: visibility,          dim: 1 }
    - { name: semantic_relation,   dim: 1 }
  spatial:
    channels: 16
    height: 32
    width: 32
  dynamics_dim: 64
  temporal_dim: 16
  global_dim: 32
  uncertainty_dim: 8

# -----------------------------------------------------------------------------
# Environment (World A defaults; World B lives under transfer.world_b)
# -----------------------------------------------------------------------------
environment:
  grid_size: 12
  num_enemies: 2
  num_resources: 4
  fog_radius: 5
  max_steps: 120
  player_hp: 4
  enemy_move_prob: 0.6
  enemy_attack_prob: 0.4
  wall_density: 0.05        # interior wall fraction (0 = open map)
  resource_cluster: true    # cluster resources around one center
  render_rgb: true
  reward:
    collect: 1.0
    explore: 0.02
    step: -0.01
    death: -1.0

# -----------------------------------------------------------------------------
# Phase 1: vision
# -----------------------------------------------------------------------------
vision:
  enabled: true
  input_height: 90
  input_width: 160
  channels: [32, 64, 128, 256]   # lightweight CNN (no transformer / ViT)
  spatial_channels: 16           # learned spatial memory channels (matches schema)
  patch_hidden: 256
  patch_out: 24                  # appearance(8) + semantic_features(16)
  detach_targets: true           # predictive-representation stability
  spatial_reg: 0.0               # anti-collapse regularizer (0 = off, instance norm suffices)
  lr_scale: 0.2                  # vision learning-rate scale vs the world model

# -----------------------------------------------------------------------------
# World model (Phase 0 keys + Phase 1 multi-step)
# -----------------------------------------------------------------------------
world_model:
  entity_hidden: 128
  spatial_channels: [32, 64]
  spatial_embed: 256
  relation_hidden: 32
  latent_dim: 64
  dynamics_hidden: 128
  head_hidden: 256
  action_embedding_dim: 32
  loss_weights:
    entity: 1.0
    spatial: 0.1
    change: 0.5
    latent: 0.1

multi_step:
  horizons: [4, 8]               # additional prediction horizons
  loss_weights:
    step1: 1.0
    step4: 0.5                   # lambda4 < 1
    step8: 0.25                  # lambda8 < lambda4
  window: 8                      # sequence length kept for training windows

rollout_schedule:
  initial_teacher_forcing: 0.9
  final_teacher_forcing: 0.2
  anneal_steps: 5000
  rollout_ratio: 0.2             # fraction of multi-step updates using model rollout

event_pred:
  enabled: true
  hidden: 64
  conf_blend: 0.5                # event confidence = blend*learned + (1-blend)*heuristic
  loss_weight: 1.0

intrinsic:
  alpha: 1.0                     # prediction error
  beta: 0.3                      # novelty
  gamma: 0.2                     # information gain
  risk_penalty: 0.5              # threat at player cell
  repetition_penalty: 0.2        # repeated action penalty
  novelty_decay: 0.99            # per-visit novelty decay
  visit_count_cap: 10
  info_goal_bonus: 0.3           # uncertainty -> information goal probability

skill_training:
  bc_epochs: 15
  bc_batch_size: 64
  lr: 0.001
  min_trajectory_steps: 8
  success_min_coverage: 0.15     # trajectory kept if exploration coverage >= this
  success_goal_succeeded: true   # or the goal succeeded
  train_steps: 400               # env steps used for data collection
  skill_name: neural_explore

training:
  batch_size: 32
  learning_rate: 0.001
  replay_capacity: 2048
  update_every: 1
  replay_update_every: 8
  replay_updates_per_tick: 1
  exploration_eps: 0.15
  epsilon_decay: 0.999
  grad_clip: 1.0
  steps: 2000
  log_every: 100
  goal_min_exploration: 0.6

planning:
  horizons:
    short: 4
    medium: 8
    long: 32
  rollout_steps: 4
  max_candidates: 4
  goal_type_horizons:
    task: short
    survival: short
    skill_improvement: short
    exploration: medium
    information: long
    learning: long

goals:
  novelty_threshold: 0.2
  threat_threshold: 0.5
  learning_threshold: 0.05
  type_weights:
    task: 1.0
    survival: 0.9
    exploration: 0.5
    information: 0.3
    learning: 0.3
    skill_improvement: 0.2

memory:
  working_capacity: 64
  episodic_capacity: 100

checkpoint:
  dir: checkpoints
  keep_last: 2

# -----------------------------------------------------------------------------
# Phase 1: transfer worlds (structurally different, not just different seeds)
# -----------------------------------------------------------------------------
transfer:
  world_a:
    name: world_a_open
    grid_size: 12
    num_enemies: 1
    num_resources: 4
    fog_radius: 6
    max_steps: 120
    player_hp: 6
    enemy_move_prob: 0.3      # slow enemies
    enemy_attack_prob: 0.3
    wall_density: 0.03        # open map
    resource_cluster: true    # clustered resources
    render_rgb: true
  world_b:
    name: world_b_narrow
    grid_size: 14
    num_enemies: 2
    num_resources: 6
    fog_radius: 4
    max_steps: 150
    player_hp: 6
    enemy_move_prob: 0.7      # fast enemies
    enemy_attack_prob: 0.6
    wall_density: 0.16        # narrow corridors
    resource_cluster: false   # scattered resources
    render_rgb: true

evaluation:
  eval_interval: 500          # steps between evaluation checkpoints
  eval_episodes: 4
  eval_max_steps: 100
  curve_steps: [1000, 5000, 10000, 20000]   # learning-curve checkpoints
  adaptation_steps: 1000      # short adaptation for transfer test
  log_dir: runs/phase1
